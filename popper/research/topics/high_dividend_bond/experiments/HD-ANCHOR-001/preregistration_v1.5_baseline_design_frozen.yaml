inheritance:
  statement_type: 方法选择
  rule: 除本文件绑定的基准可执行规格外，完全继承v1.4、v1.3、v1.2、v1.1及v1.0；不改变策略、首要指标、样本、成本或判定规则。
  immutability: 不得覆盖旧协议或阶段7冻结文件；后续变化必须新建版本并说明是否接触结果。

baseline_design_freeze:
  statement_type: 方法选择
  design_path: baseline_design_v1.0_frozen.json
  design_version: HD-STAGE7-BASELINE-DESIGN-1.0-FROZEN
  formal_oos_t0: '2022-03-10T15:00:00+08:00'
  formal_oos_price_ref_cny: 22.71
  common_initial_assets_cny: 60000
  HD-BASE-000: 1000股静态持有加剩余现金，真实分红留现金。
  HD-BASE-001: 1500股静态持有加剩余现金，真实分红留现金。
  HD-BASE-RM-001: 按冻结函数从首个OOS前36个月P00日终平均股票权重派生一个0至1500整百股静态股数，随后连续持有且不得用OOS重选。
  common_controls: 三类基准与动态策略共享标的、日期、V0、未复权价格、真实分红、税费、现金利率、公司行动、交易状态、估值、账户恒等式、终值和数据版本。
  no_initial_order: t0库存视为研究期前已有持仓，不生成买单或扣研究期前建仓费用。
  terminal_rule: 共同终点市值估值，不强制卖出。

risk_matched_share_derivation:
  statement_type: 方法选择
  calibration_window: '[2019-03-11, 2022-03-10)'
  calibration_sessions: 729个上交所会话，其中719个TRADING、10个SUSPENDED_OR_MISSING；停牌或缺失会话按最后可验证标记价估值并进入权重均值。
  calibration_roles: development_and_validation_only
  initial_account: V0为60000元，1000股按2019-03-11未复权收盘16.47元初始化，现金43530元，跨期应收与税负为0。
  daily_weight: w_t=Q_t*RawMark_t/(Cash_t+Q_t*RawMark_t+DividendReceivable_t-TaxLiability_t)
  derivation: w_bar为全部校准会话日终股票权重算术均值；q_raw=w_bar*60000/22.71；在0至1500整百股中取最近值，等距取较低且现金必须非负。
  implementation_boundary: 阶段7只冻结函数，不运行策略。阶段8账户实现验收后、任何OOS输出生成前，单独运行一次无绩效暴露校准并冻结派生股数及输入哈希。
  forbidden_calibration_outputs: [收益率, CAGR, 回撤, Sharpe, Calmar, 相对绩效, OOS结果, 封存结果]
  post_oos_guard: 全OOS及封存子期平均股票权重绝对差均不超过5个百分点；失败不得重选股数。

stage_gates:
