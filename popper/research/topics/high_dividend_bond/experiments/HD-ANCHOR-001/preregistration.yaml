  "research_question_and_hypotheses": {
    "statement_type": "研究假设",
    "question": "在只使用历史决策时点可得的分红预期、真实未复权价格、现金分红和可执行成本的条件下，当前股息率滞回策略，是否相对等资金且风险可比的静态持有产生稳定的样本外净增量？",
    "H1": "股息率锚驱动的相邻库存调整，可以提高相对静态持有的含分红净收益，或者在收益相近时降低回撤。",
    "H0": "扣除成本并进行风险匹配后，动态调仓没有稳定增量，观察到的优势来自现金仓位、未来信息、特定起点或少数交易。",
    "scope": "单公司、指定估计方法、指定成交模型和原有参数的条件性证据；不证明市场因果机制或所有高股息股票有效。"
  },
